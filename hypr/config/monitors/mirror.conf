################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

# Laptop screen
monitorv2 {
    output = eDP-1
    mode = preferred
    position = 0x0
    scale = 1
}

# Other monitors (mirror laptop screen)
monitorv2 {
    output = *
    mode = preferred
    position = auto
    scale = 1
    mirror = eDP-1
}

