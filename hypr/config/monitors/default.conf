################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

# All screens
monitorv2 {
    output = *
    mode = preferred
    position = auto
    scale = auto
}

# Laptop screen
monitorv2 {
    output = eDP-1
    mode = preferred
    position = 0x0
    scale = 1
}
